services:
  site:
    image: fce-site:latest
    build:
      context: https://github.com/azizensisheim-del/fce-site.git#main
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: https://animations-fce.fr
    ports:
      - "3001:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

