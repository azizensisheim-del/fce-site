name: fce

services:
  site:
    image: fce-site:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: "https://${FCE_HOST:-animations-fce.fr}"
    ports:
      - "${FCE_BIND_ADDRESS:-127.0.0.1}:${FCE_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: "${FCE_MEMORY_LIMIT:-1g}"
    cpus: "${FCE_CPU_LIMIT:-0.75}"
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
